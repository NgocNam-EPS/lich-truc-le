<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lịch trực lễ EPS</title><style>[hidden]{display:none!important}body{margin:0}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh trên (dịp lễ + tài khoản) + tab; mỗi ngày lễ là một tờ lịch bloc, các ca xếp cạnh nhau */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --sunk:#F4F7F6; --ink:#14201E; --muted:#596966; --line:#D5DEDB;
  --accent:#0A6656; --accent-soft:#DCEEE9; --accent-ink:#FFFFFF;
  --holiday:#C4372B; --holiday-soft:#FBE8E5; --warn:#8F5B00; --warn-soft:#FFF1D2; --danger:#B42318; --ok:#1E7A46; --ok-soft:#E1F3E8;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#16201E; --sunk:#111917; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3835;
  --accent:#48B9A3; --accent-soft:#183731; --accent-ink:#06201B;
  --holiday:#F06A5D; --holiday-soft:#3A1D1A; --warn:#F2B44C; --warn-soft:#352812; --danger:#FF8A7E; --ok:#5FCB8C; --ok-soft:#173326; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#16201E; --sunk:#111917; --ink:#E4ECEA; --muted:#93A4A0; --line:#2A3835;
  --accent:#48B9A3; --accent-soft:#183731; --accent-ink:#06201B;
  --holiday:#F06A5D; --holiday-soft:#3A1D1A; --warn:#F2B44C; --warn-soft:#352812; --danger:#FF8A7E; --ok:#5FCB8C; --ok-soft:#173326; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.mark{width:34px;height:34px;border-radius:8px;background:var(--holiday);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}

.who{display:flex;align-items:center;gap:8px;font-size:13px;flex-wrap:wrap}
.who b{font-weight:600}

.save i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
.save.saving i{background:var(--warn)} .save.error i{background:var(--danger)} .save.local i{background:var(--muted)}
nav.tabs{display:flex;gap:2px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 13px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer;white-space:nowrap}

main{padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)} .btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.sm{padding:3px 9px;font-size:12.5px} .btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent}
:is(.btn,.chip,nav.tabs button,input,select,textarea,.cand):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=search],input[type=password],input[type=date],input[type=number],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
textarea{width:100%;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-size:16px;margin:0 0 4px}.card h3{font-size:14px;margin:0 0 8px}
.hint{color:var(--muted);font-size:13px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grow{flex:1 1 auto;min-width:0}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}.field>span{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.draft{background:var(--sunk);color:var(--muted);border:1px solid var(--line)} .pill.submitted{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--ok-soft);color:var(--ok)} .pill.returned{background:var(--holiday-soft);color:var(--danger)}
.badge{display:inline-block;padding:0 6px;border-radius:999px;font-size:11px;font-weight:600;background:var(--sunk);border:1px solid var(--line)}
.badge.nt{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.badge.k{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 13px;font-size:13px}
.notice.bad{background:var(--holiday-soft);color:var(--danger)} .notice.good{background:var(--ok-soft);color:var(--ok)}
ul.msgs{margin:6px 0 0;padding-left:18px;font-size:13px} ul.msgs li{margin:2px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:9px 12px}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.stat.bad b{color:var(--danger)}
/* Tờ lịch */
.day{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.leaf .d{font-size:38px;font-weight:700;color:var(--holiday);line-height:1.1}.leaf .w{font-size:12px;font-weight:600}
.daybody{padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cas{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

.grp{display:flex;flex-direction:column;gap:6px}.grp>.lbl{font-size:12px;font-weight:600;color:var(--accent)}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px 5px 9px;min-width:0}
.chip .nm{flex:1;min-width:0;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.chip .nm b{font-weight:600}.chip .nm small{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.isnt{border-color:var(--accent)}
.chip select{padding:2px 4px;font-size:12px;border-radius:6px}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}.x:hover{color:var(--danger)}
.ntbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px;cursor:pointer;color:var(--muted)}
.ntbtn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.add{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:5px;color:var(--muted);cursor:pointer;font-weight:500}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}

table.list td.num,table.list th.num{text-align:right}
table.list input{width:100%}
table.list input[type=number]{width:84px;text-align:right}
tr.over td{background:var(--holiday-soft)} tr.near td{background:var(--warn-soft)}
.scroll{max-height:620px;overflow:auto}
.pxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pxcard{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px}
.pxcard h3{margin:0;font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px}.kv span{color:var(--muted)}
.login{max-width:420px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
.scrim{position:fixed;inset:0;background:rgba(10,20,18,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:21;display:flex;flex-direction:column;gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:16px}
.drawer h2{font-size:16px;margin:0}.drawer .body{overflow-y:auto;display:flex;flex-direction:column;gap:6px;min-height:0;flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cand{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--sunk);cursor:pointer;text-align:left;width:100%}
.cand:hover{border-color:var(--accent)} .cand small{display:block;color:var(--muted);font-size:12px}.cand .w{color:var(--danger);font-size:11.5px}
.cand .k{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:calc(100vw - 32px)}
.secrets{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;user-select:all}
.dlrow{display:flex;flex-wrap:wrap;gap:8px}
/* Văn bản pháp lý */
.lgcat{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.lghead{display:flex;gap:12px;align-items:flex-start}
.lgnum{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--sunk);border:1px solid var(--line);color:var(--muted)}
.lgnum.done{background:var(--ok);border-color:var(--ok);color:#fff}
.lghead h3{margin:0;font-size:14.5px}.lghead p{margin:2px 0 0}
.fileli{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--sunk);flex-wrap:wrap}
.fileli .ic{flex:none;width:34px;height:40px;border-radius:4px;background:var(--holiday);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.fileli .ic.img{background:var(--accent)}
.fileli .meta{flex:1;min-width:180px}.fileli .meta small{display:block;color:var(--muted);font-size:12px}
.upl{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) minmax(0,2fr) auto;gap:8px;align-items:end;border-top:1px dashed var(--line);padding-top:10px}
@media (max-width:860px){.upl{grid-template-columns:1fr 1fr}}
.pxslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pxslot{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
.pxslot .upl{grid-template-columns:1fr 1fr}
.checkl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.checkl div{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.preview{flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:var(--sunk);display:grid;place-items:center;overflow:auto}
.preview iframe{width:100%;height:100%;border:0;background:#fff}.preview img{max-width:100%}
/* Bảng theo dõi */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.prog{height:10px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex}
.prog i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c);border:1px solid var(--line)}
.now{border:1px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.now h3{margin:0;font-size:15px;color:var(--accent)}
.nowgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.nowgrid div{background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13px}.nowgrid small{display:block;color:var(--muted);font-size:11.5px}
table.mx{border-collapse:separate;border-spacing:4px;width:100%;min-width:760px}
table.mx th{font-size:12px;color:var(--muted);font-weight:600;text-align:left;padding:2px 6px;white-space:nowrap}
table.mx th.d{text-align:center}
table.mx td{padding:0;vertical-align:top}
.cellb{width:100%;min-height:58px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cellb:hover{border-color:var(--accent)}
.cellb b{font-size:12.5px;font-weight:600;line-height:1.3}.cellb small{font-size:11.5px;color:var(--muted)}
.cellb.ok{background:var(--ok-soft);border-color:transparent}.cellb.miss{background:var(--holiday-soft);border-color:transparent}.cellb.fol{background:var(--warn-soft);border-color:transparent}.cellb.na{background:transparent;border-style:dashed;cursor:default}
.cellb.cur{outline:2px solid var(--accent);outline-offset:1px}
.unitn{font-weight:600;font-size:13px;white-space:nowrap}.unitn small{display:block;font-weight:500}
.otbars{display:flex;flex-direction:column;gap:8px}
.otb{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:13px}
.otb .tr{position:relative;height:14px;background:var(--sunk);border-radius:4px}
.otb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--accent)}
.otb .tr i.near{background:var(--warn)}.otb .tr i.over{background:var(--danger)}
.otb .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.otb .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.otb .nm small{color:var(--muted)}
.leadstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.leadstrip>div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:flex-start}
.mini{background:var(--holiday-soft);color:var(--holiday);border-radius:6px;padding:4px 7px;text-align:center;font-weight:700;line-height:1.1;font-size:18px}.mini small{display:block;font-size:10px;font-weight:600}
label.row{flex-wrap:nowrap;align-items:flex-start}label.row input[type=checkbox]{margin-top:3px;flex:none}
@media (max-width:640px){.day{grid-template-columns:1fr}.leaf{flex-direction:row;gap:10px;border-right:0;border-bottom:1px solid var(--line);padding:8px 12px}.leaf .d{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="topbar">

<script>
const DEFAULT_STAFF_RAW = [];
const DEFAULT_ORG = {"company": ["TỔNG CÔNG TY PHÁT ĐIỆN 3", "CÔNG TY DỊCH VỤ SỬA CHỮA", "CÁC NHÀ MÁY ĐIỆN EVNGENCO3"], "gd": {"role": "GĐ\nChỉ đạo chung", "text": ""}, "pgd": [{"role": "PGĐ KD\nChỉ đạo công tác sản xuất kinh doanh khác, PX GC-PH", "text": ""}, {"role": "PGĐ KT\nChỉ đạo công tác liên quan\n đến kỹ thuật của các PXSC", "text": ""}, {"role": "PGĐ KH\nChỉ đạo phần thuê nhân sự ngoài và mua sắm vật tư", "text": ""}], "groups": [{"role": "Phụ trách Kỹ thuật", "people": []}, {"role": "Phòng HC-LĐ", "people": []}, {"role": "Phòng KH-VT", "people": []}, {"role": "PX GC-PH", "people": []}], "sodoTop": [], "sodoKT": "", "key": {}, "limits": {"month": 40, "year": 300}, "hours": {"ca": 12, "canboDay": 12, "phoneNight": 0}, "titles": {}};
/* ===== XW: bộ ghi file .xlsx tối giản, có định dạng (không cần thư viện ngoài) ===== */
const XW = (() => {
  const enc = new TextEncoder();
  const xesc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '');
  const colName = n => { let s = ''; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const ref = (r, c) => colName(c) + r;
  let CRC; const crc32 = u8 => { if (!CRC) { CRC = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; CRC[n] = c >>> 0; } }
    let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function zip(files) {
    const parts = [], central = []; let off = 0;
    files.forEach(f => {
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint16(10, 0, true); h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
      parts.push(new Uint8Array(h.buffer), name, data);

function curShift(h) {
  const now = new Date(); const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const today = ymd(now), hr = now.getHours(); const yest = ymd(new Date(now.getTime() - 864e5));
  for (const d of h.days) {
    if (d.date === today && d.ca1 && hr >= 7 && hr < 19) return { date: d.date, c: 'c1', live: true };
    if (d.date === today && d.ca2 && hr >= 19) return { date: d.date, c: 'c2', live: true };
    if (d.date === yest && d.ca2 && hr < 7) return { date: d.date, c: 'c2', live: true };
  }
  const first = h.days.map(d => ({ d, c: d.ca1 ? 'c1' : 'c2' })).find(x => x.d.date >= today);
  return first ? { date: first.d.date, c: first.c, live: false } : null;
}

}

  if (S.mode !== 'db') { S.units = clone((loadLocal().unitsBy || {})[S.cur] || {}); return; }
  filesUnsub = db.collection(`holidays/${S.cur}/files`).onSnapshot(snap => { const n = {}; snap.docs.forEach(d => { const p = `holidays/${S.cur}/files/${d.id}`; if (pend.has(p)) { if (S.files[d.id]) n[d.id] = S.files[d.id]; } else n[d.id] = clone(d.data()); });
    Object.keys(S.files).forEach(id => { if (pend.has(`holidays/${S.cur}/files/${id}`) && S.files[id]) n[id] = S.files[id]; }); S.files = n; if (!S.panel) render(); }, () => { });
  const hid = S.cur;
  unitsUnsub = db.collection(`holidays/${hid}/units`).onSnapshot(snap => {
    if (hid !== S.cur) return; const next = {};
    snap.docs.forEach(d => { const p = `holidays/${hid}/units/${d.id}`; next[d.id] = pend.has(p) ? S.units[d.id] : clone(d.data()); });
    Object.keys(S.units).forEach(id => { if (pend.has(`holidays/${hid}/units/${id}`)) next[id] = S.units[id]; });
    S.units = next; if (!S.panel || S.panel.type !== 'add') render(); else { renderTop(); }

}
async function boot() {
  render(); const c = window.claude;

  try { dl = c && c.use ? await c.use('downloads') : null; } catch (e) { dl = null; }

  try { ast = c && c.use && db ? await c.use('assets') : null; } catch (e) { ast = null; }
  const owner = usr ? usr.isOwner() : !db;
  if (owner) S.me = { role: 'owner', name: 'Chủ sở hữu' };
  try { const cw = usr && usr.can ? usr.can('data.write') : null; S.canWrite = cw; } catch (e) { }
  if (!db) {
    const L = loadLocal(); S.mode = 'local'; S.holidays = L.holidays || {}; S.org = L.org || S.org; S.phones = L.phones || {}; S.outside = L.outside || {}; S.accounts = L.accounts || []; S.accountsLoaded = true;
    ensureCur(); subUnits(); resolveSession(); setSave('idle'); render(); return;
  }
  S.mode = 'db'; let got = 0; const ready = () => { if (++got >= 2 && S.mode === 'db') { resolveSession(); render(); } };
  const to = setTimeout(() => { if (!got) toast('Kết nối dữ liệu chậm, vui lòng chờ hoặc tải lại.'); }, 10000);
  db.collection('holidays').onSnapshot(snap => { clearTimeout(to);
    const next = {}; snap.docs.forEach(d => { next[d.id] = pend.has('holidays/' + d.id) ? S.holidays[d.id] : clone(d.data()); });
    Object.keys(S.holidays).forEach(id => { if (pend.has('holidays/' + id) && S.holidays[id]) next[id] = S.holidays[id]; });
    S.holidays = next; const before = S.cur; ensureCur(); if (S.cur && before === S.cur && !unitsUnsub) subUnits(); if (S.mode === 'loading') S.mode = 'db'; ready(); render(); },
    err => setSave('error', err && (err.message || err.code)));
  db.doc('config/accounts').onSnapshot(d => { S.accounts = d.exists ? clone((d.data() || {}).list || []) : []; S.accountsLoaded = true; resolveSession(); ready(); render(); }, () => { S.accountsLoaded = true; ready(); render(); });
  db.doc('org/main').onSnapshot(d => { if (d.exists && !pend.has('org/main')) { S.org = Object.assign(clone(DEFAULT_ORG), clone(d.data())); render(); } }, () => { });
  db.collection('outside').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => n[d.id] = pend.has('outside/' + d.id) ? S.outside[d.id] : clone(d.data())); S.outside = n; if (!S.panel) render(); }, () => { });
  db.collection('phones').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => n[d.id] = pend.has('phones/' + d.id) ? S.phones[d.id] : clone(d.data())); S.phones = n; render(); }, () => { });
}

/* Văn bản lưu trong Firestore, chia nhỏ từng phần 900 KB (không cần gói trả phí) */
const CHUNK = 900 * 1024;
function makeAst() {
  return {
    upload: async (file, opt) => {
      const buf = new Uint8Array(await file.arrayBuffer()); const id = uid('a'); const n = Math.ceil(buf.length / CHUNK) || 1;
      for (let i = 0; i < n; i++) await db.doc(`filedata/${id}_${i}`).set({ i, n, d: firebase.firestore.Blob.fromUint8Array(buf.subarray(i * CHUNK, (i + 1) * CHUNK)), type: opt.type, at: Date.now() });
      return { id: id + ':' + n, sizeBytes: buf.length, contentType: opt.type };
    },
    read: async (assetId, type) => {
      const [id, n] = assetId.split(':'); const parts = [];
      for (let i = 0; i < +n; i++) { const d = await db.doc(`filedata/${id}_${i}`).get(); if (!d.exists) throw new Error('Tệp đã bị xóa hoặc chưa tải lên xong.'); parts.push(d.data().d.toUint8Array()); }
      return new Blob(parts, { type: type || 'application/octet-stream' });
    },
    delete: async assetId => { const [id, n] = assetId.split(':'); for (let i = 0; i < +n; i++) await db.doc(`filedata/${id}_${i}`).delete(); }
  };
}

    ${S.newCreds ? `<div class="notice good stack"><b>Thông tin đăng nhập vừa tạo. Hãy sao chép và gửi cho từng đơn vị; sau khi đóng sẽ không xem lại được.</b><div class="secrets" id="creds">${esc(S.newCreds)}</div><div class="row"><button class="btn sm" data-act="copyCreds">Sao chép</button><button class="btn sm" data-act="closeCreds">Đã lưu, đóng lại</button></div></div>` : ''}
    <div class="row">${missing ? `<button class="btn primary" data-act="createPxAccs">Tạo tài khoản cho ${missing} đơn vị chưa có (7 phân xưởng và Phòng KT-AT)</button>` : ''}${!list.some(a => a.role === 'viewer') ? '<button class="btn" data-act="createViewer">Tạo tài khoản chỉ xem</button>' : ''}</div>
    <div class="tbl"><table class="list"><thead><tr><th>Tên đăng nhập</th><th>Đơn vị / vai trò</th><th></th></tr></thead><tbody>
    ${S.roles.map((a, i) => a.role === 'owner' ? `<tr><td><b>${esc(a.u)}</b></td><td>Chủ sở hữu (quản trị cao nhất)</td><td></td></tr>` : `<tr><td><b>${esc(a.u)}</b></td><td>${a.role === 'px' ? esc(PXI[a.px].name) : a.role === 'lead' ? 'Phòng KT-AT — nhập lịch Lãnh đạo & các Phòng' : a.role === 'viewer' ? 'Chỉ xem — ' + esc(a.name || '') : 'Quản trị — ' + esc(a.name || '')}</td>
      <td class="num"><button class="btn sm" data-act="resetPw" data-i="${i}">Cấp tài khoản mới</button> <button class="btn sm danger ${S.armed === 'delAcc' + i ? 'armed' : ''}" data-act="delAcc" data-i="${i}">${S.armed === 'delAcc' + i ? 'Bấm lần nữa' : 'Khóa'}</button></td></tr>`).join('')}
    </tbody></table></div></section>
  <form class="card stack" id="newacc"><h3>Thêm tài khoản</h3><div class="row">
    <label class="field"><span>Tên đăng nhập</span><input id="na_u" type="text" required pattern="[a-z0-9._\\-]{3,30}" placeholder="vd: ktat2"></label>
    <label class="field"><span>Vai trò</span><select id="na_r"><option value="viewer">Chỉ xem (bảng theo dõi, giờ làm thêm, tải file)</option><option value="lead">Phòng KT-AT (nhập lịch Lãnh đạo & các Phòng)</option><option value="admin">Quản trị (xem, duyệt, xuất file)</option>${PX.map(p => `<option value="px:${p.id}">Phân xưởng ${esc(p.short)}</option>`).join('')}</select></label>
    <label class="field grow"><span>Tên hiển thị</span><input id="na_n" type="text"></label></div>
    <div><button class="btn" type="submit">Tạo tài khoản</button></div></form>`;
};

/* ===== Dữ liệu: nhập dữ liệu ban đầu, danh sách nhân sự ===== */
function viewData() {
  return `<section class="card stack"><h2>Dữ liệu ứng dụng</h2>
    <div class="stats"><div class="stat"><b>${STAFF.length}</b><span>Nhân sự trong danh sách</span></div><div class="stat"><b>${Object.keys(S.holidays).length}</b><span>Dịp lễ</span></div><div class="stat"><b>${Object.values(S.phones).reduce((a, d) => a + Object.keys((d && d.map) || {}).length, 0)}</b><span>Số điện thoại</span></div></div>
    ${!STAFF.length ? '<p class="notice">Chưa có danh sách nhân sự. Hãy nhập tệp dữ liệu ban đầu hoặc tệp Excel tổng hợp nhân sự.</p>' : `<p class="hint">Nguồn danh sách: ${esc(S.staffSource || '')}</p>`}</section>
  <section class="card stack"><h3>1. Nhập tệp dữ liệu ban đầu (.json)</h3><p class="hint">Tệp do Claude chuẩn bị, gồm danh sách nhân sự, sơ đồ phối hợp, số điện thoại, danh bạ thuê ngoài và dịp lễ 24/11/2026. Không đưa tệp này lên GitHub vì có thông tin cá nhân.</p>
    <div class="row"><input id="seedfile" type="file" accept=".json,application/json"><button class="btn primary" data-act="importSeed">Nhập dữ liệu</button></div></section>
  <section class="card stack"><h3>2. Cập nhật danh sách nhân sự từ Excel</h3><p class="hint">Tệp Excel cùng mẫu "Tổng hợp điều phối nhân sự": sheet <b>Tong hop</b> có các cột Số hiệu, Họ và tên, Năm sinh, Giới tính, Chức danh, Phòng ban, Phân loại.</p>
    <div class="row"><input id="stafffile" type="file" accept=".xlsx,.xls"><button class="btn" data-act="importStaff">Cập nhật danh sách</button></div></section>`;
}
ACT.importSeed = async () => {
  const f = E('seedfile').files[0]; if (!f) { toast('Hãy chọn tệp .json'); return; }
  try {
    const J = JSON.parse(await f.text()); let n = 0;
    if (J.staff) { await db.doc('staff/main').set({ list: encStaff(J.staff), source: J.staffSource || f.name, updatedAt: Date.now() }); n++; }
    if (J.org) { await db.doc('org/main').set(J.org); n++; }
    for (const [k, v] of Object.entries(J.phones || {})) { await db.doc('phones/' + k).set(v); n++; }
    for (const [k, v] of Object.entries(J.outside || {})) { await db.doc('outside/' + k).set(v); n++; }
    for (const h of J.holidays || []) { const ex = await db.doc('holidays/' + h.id).get(); if (!ex.exists) { await db.doc('holidays/' + h.id).set(h); n++; } }
    toast(`Đã nhập ${n} mục dữ liệu.`);
  } catch (x) { toast('Không nhập được: ' + (x.message || x.code || x)); }
};
ACT.importStaff = async () => {
  const f = E('stafffile').files[0]; if (!f) { toast('Hãy chọn tệp Excel'); return; } if (typeof XLSX === 'undefined') { toast('Không tải được thư viện đọc Excel.'); return; }
  try {
    const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }); const ws = wb.Sheets['Tong hop'] || wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' }); const hi = rows.findIndex(r => r.some(c => String(c).trim() === 'Số hiệu'));
    if (hi < 0) { toast('Không thấy cột "Số hiệu".'); return; }
    const H = rows[hi].map(c => String(c).trim()); const ci = ['Số hiệu', 'Họ và tên', 'Năm sinh', 'Giới tính', 'Chức danh', 'Phòng ban', 'Phân loại'].map(n => H.indexOf(n));
    if (ci.some(x => x < 0)) { toast('Tệp thiếu cột bắt buộc.'); return; }
    const seen = new Map(), out = [];
    rows.slice(hi + 1).forEach(r => { let id = String(r[ci[0]]).trim(); const name = String(r[ci[1]]).trim(); if (!id || !name) return;
      if (seen.has(id)) { seen.set(id, seen.get(id) + 1); id = 'CHUA-CO-SH-' + id + '-' + seen.get(id); } else seen.set(id, 1);
      out.push([id, name, r[ci[2]] || '', String(r[ci[3]]).trim(), String(r[ci[4]]).trim(), String(r[ci[5]]).trim(), String(r[ci[6]]).trim()]); });
    await db.doc('staff/main').set({ list: encStaff(out), source: f.name + ' (' + new Date().toLocaleDateString('vi-VN') + ')', updatedAt: Date.now() }); toast(`Đã cập nhật ${out.length} nhân sự.`);
  } catch (x) { toast('Không đọc được tệp: ' + (x.message || x)); }
};

/* ===== Khởi động ===== */
function unsubAll() { subs.forEach(f => { try { f(); } catch (e) { } }); subs = []; if (unitsUnsub) { unitsUnsub(); unitsUnsub = null; } if (filesUnsub) { filesUnsub(); filesUnsub = null; } }
async function onAuth(user) {
  unsubAll(); CURRENT_UID = user ? user.uid : null; window.CURRENT_UID = CURRENT_UID;
  if (!user) { S.me = null; S.tab = null; S.holidays = {}; S.units = {}; S.files = {}; S.roles = []; setStaff([], ''); render(); return; }
  try {
    const [m, r] = await Promise.all([db.doc('config/meta').get(), db.doc('roles/' + user.uid).get()]);
    const isOwner = m.exists && m.data().owner === user.uid; const role = r.exists ? r.data() : null;
    if (!isOwner && !role) { S.loginNote = 'Tài khoản này đã bị khóa hoặc chưa được cấp quyền.'; await fbAuth.signOut(); return; }
    S.loginNote = ''; S.me = isOwner ? { role: 'owner', u: (role && role.u) || 'owner', name: (role && role.name) || 'Chủ sở hữu' } : { role: role.role, px: role.px, u: role.u, name: role.name };
  } catch (x) { S.loginNote = 'Không đọc được quyền tài khoản: ' + (x.message || x.code); await fbAuth.signOut(); return; }
  S.mode = 'db'; S.tab = defaultTab(); ast = S.me.role === 'viewer' ? null : makeAst();
  const err = x => setSave('error', x && (x.message || x.code));
  subs.push(db.doc('staff/main').onSnapshot(d => { const v = d.exists ? d.data() : null; setStaff(v ? v.list : [], v ? v.source : ''); render(); }, err));
  subs.push(db.collection('holidays').onSnapshot(snap => { const next = {}; snap.docs.forEach(d => { next[d.id] = pend.has('holidays/' + d.id) ? S.holidays[d.id] : clone(d.data()); });
    Object.keys(S.holidays).forEach(id => { if (pend.has('holidays/' + id) && S.holidays[id]) next[id] = S.holidays[id]; });
    S.holidays = next; const before = S.cur; ensureCur(); if (S.cur && before === S.cur && !unitsUnsub) subUnits(); render(); }, err));
  subs.push(db.doc('org/main').onSnapshot(d => { if (d.exists && !pend.has('org/main')) { S.org = Object.assign(clone(DEFAULT_ORG), clone(d.data())); render(); } }, () => { }));
  subs.push(db.collection('phones').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => n[d.id] = pend.has('phones/' + d.id) ? S.phones[d.id] : clone(d.data())); S.phones = n; if (!S.panel) render(); }, () => { }));
  subs.push(db.collection('outside').onSnapshot(snap => { const n = {}; snap.docs.forEach(d => n[d.id] = pend.has('outside/' + d.id) ? S.outside[d.id] : clone(d.data())); S.outside = n; if (!S.panel) render(); }, () => { }));
  if (S.me.role === 'owner') subs.push(db.collection('roles').onSnapshot(snap => { S.roles = snap.docs.map(d => Object.assign({ uid: d.id }, d.data())).sort((a, b) => (a.at || 0) - (b.at || 0)); if (S.tab === 'accounts') render(); }, () => { }));
  setSave('idle'); render();
}
async function webBoot() {
  render();
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || /DIEN_/.test(cfg.apiKey) || typeof firebase === 'undefined') {
    E('main').innerHTML = `<div class="card stack"><h2>Chưa cấu hình Firebase</h2><p class="hint">Mở tệp <b>firebase-config.js</b> trong repository và dán cấu hình dự án Firebase (xem README.md).</p></div>`; return;
  }
  fbApp = firebase.initializeApp(cfg); fbAuth = firebase.auth(); db = firebase.firestore();
  try { db.enablePersistence && await db.enablePersistence({ synchronizeTabs: true }); } catch (e) { }
  try { const m = await db.doc('config/meta').get(); S.noOwner = !m.exists; } catch (e) { S.noOwner = false; }
  S.mode = 'db'; S.authReady = true;
  fbAuth.onAuthStateChanged(u => { if (S.settingUp) return; if (S.noOwner && !u) { render(); return; } onAuth(u); });
  render();
}
webBoot();

</script>
